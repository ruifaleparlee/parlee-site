<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARLEE — Simulador</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C1B19;--panel:#232220;--panel2:#2A2926;--line:#34322E;--line2:#4A4742;--text:#F2EEE8;--muted:#B3ADA4;--accent:#D98A3D;--accent-ink:#1C1B19;--me:#3A2E1F;--pro-bg:#2C2620;--ok:#A8E0BC;--warn:#F2B8A8;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F1EA;--panel:#FFFFFF;--panel2:#FAF7F2;--line:#E2DCD2;--line2:#C9C1B4;--text:#1C1B19;--muted:#5A5650;--accent:#B5701F;--accent-ink:#FFFFFF;--me:#F3DDBF;--pro-bg:#FBEFDD;--ok:#1F6B3A;--warn:#9A3A22;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1C1B19;--panel:#232220;--panel2:#2A2926;--line:#34322E;--line2:#4A4742;--text:#F2EEE8;--muted:#B3ADA4;--accent:#D98A3D;--accent-ink:#1C1B19;--me:#3A2E1F;--pro-bg:#2C2620;--ok:#A8E0BC;--warn:#F2B8A8;color-scheme:dark}
:root[data-theme="light"]{--bg:#F4F1EA;--panel:#FFFFFF;--panel2:#FAF7F2;--line:#E2DCD2;--line2:#C9C1B4;--text:#1C1B19;--muted:#5A5650;--accent:#B5701F;--accent-ink:#FFFFFF;--me:#F3DDBF;--pro-bg:#FBEFDD;--ok:#1F6B3A;--warn:#9A3A22;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:-.2px;line-height:1.08;margin:0}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand b{font-family:'Barlow Condensed',sans-serif;font-size:26px}
.crumb{color:var(--muted);font-size:15px}
.btn{min-height:46px;padding:0 22px;border-radius:6px;border:1px solid var(--line2);background:transparent}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:56px;font-size:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px}
.av.sm{width:36px;height:36px;font-size:15px}
/* home */
.hero{padding:48px 0 28px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.hero h1{font-size:60px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:5px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);font-weight:600}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin:8px 0 18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{display:flex;flex-direction:column;gap:14px;padding:24px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:border-color .15s}
.pcard:hover{border-color:var(--muted)}
.pcard.pro{border:2px solid var(--accent);background:var(--pro-bg)}
.pcard h3{font-size:28px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--me)}
.tag.pro{background:var(--accent);color:var(--accent-ink)}
.soon{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.soon span{font-size:15px;color:var(--muted);border:1px dashed var(--line2);border-radius:20px;padding:6px 14px}
/* brief */
.bgrid{display:grid;grid-template-columns:1fr 360px;gap:28px;padding:36px 0 56px;align-items:start}
.dossier{padding:32px;display:flex;flex-direction:column;gap:26px}
.dhead{display:flex;gap:16px;align-items:center}
.goal{border-left:4px solid var(--accent);padding:4px 0 4px 18px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.start{position:sticky;top:96px;padding:26px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{background:var(--panel2);border-radius:8px;padding:12px 14px}
.fact b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:26px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--pro-bg)}
.opt input{margin-top:5px;accent-color:var(--accent)}
/* meeting */
.mgrid{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
.side{position:sticky;top:92px;display:flex;flex-direction:column;gap:14px;padding:22px 0}
.clock{padding:20px}
.clock .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:60px;line-height:1}
.clock .t.late{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.phases li{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--muted);font-size:15px}
.phases li::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--line2)}
.phases li.done::before{background:var(--line2)}
.phases li.now{color:var(--text);font-weight:600}
.phases li.now::before{border-color:var(--accent);background:var(--accent)}
.chatcol{display:flex;flex-direction:column;min-height:calc(100vh - 69px)}
.chat{flex:1;display:flex;flex-direction:column;gap:18px;padding:28px 0}
.row{display:flex;gap:12px;align-items:flex-end;max-width:84%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:14px 18px;border-radius:14px;white-space:pre-wrap}
.row.cl .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.row.me .bub{background:var(--me);border-bottom-right-radius:4px}
.bub .act{color:var(--muted);font-style:italic}
.typing{color:var(--muted)}
.composer{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cbox{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{border:0;outline:0;background:transparent;color:var(--text);font:inherit;resize:none;min-height:56px;max-height:220px}
.cact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mobilebar{display:none}
.nextbox{margin-top:40px;padding:32px;border-radius:12px;border:2px solid var(--accent);background:var(--pro-bg);display:flex;flex-direction:column;gap:22px}
.nextlist{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.nextlist li{counter-increment:n;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px;font-size:18px;line-height:1.5}
.nextlist li::before{content:counter(n);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px}
@media (max-width:960px){.nextlist{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb, #000 55%, transparent)}
.modal .box{max-width:440px;width:100%;padding:28px;display:flex;flex-direction:column;gap:18px}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.plancard{padding:26px;display:flex;flex-direction:column;gap:14px}
.plancard.prohi{border:2px solid var(--accent);background:var(--pro-bg)}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feat li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.feat li span:first-child{color:var(--muted)}
.feat .no{color:var(--muted)}
.step{display:flex;align-items:baseline;gap:12px;margin:40px 0 16px}
.step b{font-family:'Barlow Condensed',sans-serif;font-size:30px;color:var(--accent)}
.step h2{font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{text-align:left;padding:18px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile[aria-pressed="true"]{border:2px solid var(--accent)}
.tile strong{font-size:18px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.locked{opacity:.6}
.pcard.locked{cursor:pointer}
.pcard[disabled]{cursor:not-allowed}
.blur{filter:blur(6px);user-select:none}
@media (max-width:960px){.offer,.levels{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.tiles{grid-template-columns:1fr}.feat li{grid-template-columns:1fr}}
.plan{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--me)}
.plan.pro{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;padding:0 4px}
.lock{opacity:.85}
.auth{max-width:520px;margin:64px auto;padding:36px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{min-height:48px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit}
/* report */
.rhead{padding:36px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.rhero{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:30px;align-items:center}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:96px;line-height:.95}
.status{display:inline-block;font-weight:600;padding:6px 12px;border-radius:6px;background:var(--panel2)}
.hidden{margin-top:18px;padding:18px 20px;border-radius:10px;background:var(--panel2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dim{padding:22px;display:flex;flex-direction:column;gap:12px}
.pips{display:flex;gap:4px}
.pips i{width:26px;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--line2);font-style:italic}
.km{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.km .panel{padding:26px;display:flex;flex-direction:column;gap:12px}
.km .key{border:2px solid var(--accent)}
.recs{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:12px}
.recs li{counter-increment:r;display:flex;gap:16px;align-items:flex-start;padding:16px 20px}
.recs li::before{content:counter(r);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;color:var(--accent);line-height:1}
.sec{margin:34px 0 14px;font-size:32px}
.err{color:var(--warn)}
@media (max-width:960px){.cards{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.bgrid,.mgrid{grid-template-columns:1fr}.start,.side{position:static}.side{display:none}.mobilebar{display:flex;position:sticky;top:69px;z-index:4;background:var(--bg);justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rhero,.dgrid,.km{grid-template-columns:1fr}}
@media (max-width:620px){.cards{grid-template-columns:1fr}.hero h1{font-size:44px}.row{max-width:96%}.big{font-size:76px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="#" id="home" aria-label="PARLEE">
<svg width="45" height="30" viewBox="0 0 132 88" aria-hidden="true"><defs><clipPath id="lg"><circle cx="44" cy="44" r="40"/></clipPath></defs><circle cx="88" cy="44" r="36" fill="var(--accent)" clip-path="url(#lg)"/><circle cx="44" cy="44" r="40" fill="none" stroke="var(--text)" stroke-width="8"/><circle cx="88" cy="44" r="40" fill="none" stroke="var(--text)" stroke-width="8"/></svg><b>PARLEE</b></a>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end"><span class="crumb" id="crumb"></span><div id="acct" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div></div>
</div></header>
<main id="app" aria-live="polite"></main>
<script>
const P=[{"seg": "Eletricidade", "id": "E1", "titulo": "Diretor financeiro de fábrica de embalagens", "nome": "Jorge Antunes", "cargo": "Diretor financeiro", "empresa": "Plastimar, fábrica de embalagens plásticas em Aveiro", "desc": "Precisa de previsibilidade para o orçamento. Hesita entre preço fixo e indexado.", "briefing": "Vai reunir com Jorge Antunes, diretor financeiro da Plastimar, fábrica de embalagens plásticas em Aveiro, com 220 trabalhadores, ligada em média tensão e a laborar em três turnos. O contrato atual termina daqui a três meses e ele pediu propostas a três comercializadoras.", "objetivo": "Sair com o acordo do Jorge para apresentar uma proposta formal, com uma estrutura de preço que ele aceite levar à administração.", "objecao": "Quero preço fixo. O indexado é um risco que não volto a correr.", "real": "Na crise de preços tinha um contrato indexado e a fatura duplicou em poucos meses; a administração responsabilizou-o. Quer uma decisão que consiga defender. Não percebe bem que um preço fixo hoje inclui um prémio de risco elevado.", "pistas": "\"já passei por isso uma vez\"; \"quem explica ao conselho sou eu\"; \"o orçamento do próximo ano tem de fechar este mês\"", "cede": "O vendedor explora o que aconteceu, explica com simplicidade o custo do preço fixo e propõe uma estrutura defensável (parte fixa e parte indexada com teto, ou fixo a 12 meses com revisão), com cenários simples de subida e descida.", "fecha": "Insistir no indexado sem reconhecer o que ele viveu; usar jargão sem explicar; prometer que os preços não vão voltar a subir.", "estilo": "Formal, metódico, prudente. Faz perguntas de controlo e anota.", "pro": false, "ex": "Reunião de seguimento, depois de uma primeira proposta de preço fixo da Lumina. Tens uma proposta concorrente de preço fixo cerca de 5% abaixo, mas com penalização elevada por saída antecipada, que ainda não leste com atenção. Segunda preocupação escondida: o grupo está a estudar vender a fábrica nos próximos 18 meses e precisas de um contrato que não seja um obstáculo; só o revelas se o vendedor perguntar pelo horizonte da empresa e criar confiança. Pressão: 'ou chegam a esse valor, ou a decisão está tomada'. Cedes se o vendedor, sem atacar o concorrente, te levar a olhar para as condições de saída, descobrir a preocupação com o futuro da fábrica e propuser flexibilidade contratual (cessão de posição contratual ou saída com aviso prévio razoável) como valor que justifica a diferença de preço."}, {"seg": "Eletricidade", "id": "E2", "titulo": "Gestora de energia de cadeia de retalho", "nome": "Inês Carvalho", "cargo": "Gestora de energia e facilities", "empresa": "Casa&Obra, cadeia de 25 lojas de bricolage", "desc": "25 lojas com contratos diferentes. Quer uma única fatura e menos trabalho administrativo.", "briefing": "Vai reunir com Inês Carvalho, gestora de energia e facilities da Casa&Obra, cadeia de 25 lojas de bricolage em Portugal continental, em baixa tensão especial ou média tensão, com contratos espalhados por dois fornecedores.", "objetivo": "Sair com o acordo da Inês para preparar uma proposta de contrato único para as 25 lojas.", "objecao": "Quero tudo num só fornecedor e um preço mais baixo do que tenho hoje.", "real": "A equipa de duas pessoas perde vários dias por mês a validar faturas loja a loja. A administração atribuiu-lhe uma meta de redução de consumo de 10% e ela não tem dados por loja para saber onde atuar.", "pistas": "\"passamos a vida a conferir faturas\"; \"às vezes nem sei porque é que uma loja gasta o dobro de outra\"; \"tenho uma meta de eficiência este ano\"", "cede": "O vendedor percebe o peso administrativo e a meta de eficiência e propõe faturação agregada com detalhe por loja, acesso a dados de consumo e apoio para cumprir a meta. Um preço competitivo chega.", "fecha": "Reduzir tudo ao preço por kWh; prometer funcionalidades que não sabe explicar; ignorar o problema das faturas.", "estilo": "Prática, simpática, sobrecarregada. Às vezes interrompe para atender o telefone.", "pro": false, "ex": "Está também presente o diretor financeiro, que só quer saber do preço e acha que a mudança de fornecedor dá demasiado trabalho (fala também por ele, identificando quem fala). Há uma proposta concorrente 4% mais barata, mas sem faturação agregada nem dados por loja. Segunda preocupação escondida: três lojas vão fechar e duas abrir no próximo ano, e ela precisa de um contrato que permita entradas e saídas de locais sem penalização. Cedem se o vendedor ligar a fatura única e os dados por loja à meta de eficiência, mostrar ao diretor financeiro o custo do trabalho administrativo atual e oferecer flexibilidade para abrir e fechar lojas."}, {"seg": "Eletricidade", "id": "E3", "titulo": "Diretor técnico de centro comercial", "nome": "Tiago Mendes", "cargo": "Diretor técnico", "empresa": "Centro Comercial Atlântico, Grande Porto, 120 lojas", "desc": "Climatização e áreas comuns pesam muito. Tem de refaturar parte do consumo aos lojistas.", "briefing": "Vai reunir com Tiago Mendes, diretor técnico do Centro Comercial Atlântico, no Grande Porto, com 120 lojas, gerido por uma empresa de gestão em nome de um fundo. Tem um ponto de entrega em média tensão; a climatização e as áreas comuns são o maior consumo, e parte da energia é refaturada aos lojistas.", "objetivo": "Sair com o acordo do Tiago para uma reunião técnica com a equipa de gestão, com vista a uma proposta.", "objecao": "Só me interessa o preço por kWh. O resto é igual em todos.", "real": "A refaturação aos lojistas gera reclamações constantes, porque os contadores parciais são antigos e os lojistas desconfiam dos valores. O fundo proprietário exige relatórios de sustentabilidade e a última auditoria correu mal.", "pistas": "\"os lojistas reclamam de tudo\"; \"o fundo agora pede relatórios para tudo\"; \"a última auditoria não correu bem\"", "cede": "O vendedor descobre os conflitos de refaturação e a pressão do fundo e propõe contadores inteligentes certificados com plataforma de acesso por loja e garantias de origem renovável documentadas.", "fecha": "Discutir só preço; falar de sustentabilidade sem documentação concreta; cometer erros técnicos sobre a instalação, como envolver a distribuidora nos contadores internos.", "estilo": "Técnico, cético, conhece bem a instalação. Testa o vendedor com perguntas técnicas.", "pro": false, "ex": "Está também presente o consultor técnico do fundo, que testa cada afirmação técnica e quer ver documentação (fala também por ele, identificando quem fala). Há uma proposta concorrente com preço por kWh mais baixo, mas sem contadores nem garantias de origem. Segunda preocupação escondida: o fundo está a preparar a venda do centro dentro de dois anos e qualquer investimento ou contrato tem de ser transferível para o comprador. Encerram ao segundo erro técnico grave. Cedem se o vendedor responder com rigor ao consultor, propuser contadores certificados com propriedade do centro e um contrato cedível em caso de venda."}, {"seg": "Eletricidade", "id": "E4", "titulo": "Diretora de compras de grupo hoteleiro", "nome": "Carla Pinto", "cargo": "Diretora de compras", "empresa": "Grupo Sol Nascente, seis hotéis no Algarve", "desc": "Consumo muito sazonal. Já tem uma proposta de outro fornecedor em cima da mesa.", "briefing": "Vai reunir com Carla Pinto, diretora de compras do grupo Sol Nascente, com seis hotéis no Algarve, cliente atual da Lumina Energia, com o contrato a terminar. O consumo concentra-se entre maio e outubro.", "objetivo": "Renovar o contrato do grupo por 24 meses.", "objecao": "Tenho uma proposta 6% mais barata. Ou igualam ou mudamos.", "real": "No contrato atual pagou penalizações por consumir muito abaixo do volume previsto no inverno, quando dois hotéis fecham. O administrador quer anunciar que o grupo usa 100% de energia renovável. A proposta concorrente pode ter o mesmo problema, mas ela ainda não comparou as condições.", "pistas": "\"no inverno isto fica meio vazio\"; \"o ano passado houve umas surpresas na fatura\"; \"o administrador fala muito de sustentabilidade\"", "cede": "O vendedor não iguala o preço a seco, explora as surpresas na fatura, propõe flexibilidade de volume sem penalização e garantias de origem, e ajuda-a a comparar as condições das duas propostas.", "fecha": "Igualar o preço de imediato; desvalorizar o concorrente; ignorar as penalizações que já pagou.", "estilo": "Negociadora experiente, firme, usa silêncios. Respeita quem prepara bem a reunião.", "pro": false, "ex": "Reunião de renegociação final: já houve uma primeira reunião e a Carla traz a proposta concorrente impressa, agora 8% mais barata. Está presente o administrador do grupo, que quer anunciar já que o grupo é 100% renovável e tem pressa em fechar (fala também por ele, identificando quem fala). Segunda preocupação escondida: o grupo vai abrir um sétimo hotel com piscina aquecida e funcionamento todo o ano, o que muda o perfil de consumo. Encerram ao segundo erro grave, como igualar o preço sem contrapartida. Cedem se o vendedor levar os dois a comparar as condições de volume das propostas, incluir o novo hotel com flexibilidade e oferecer garantias de origem documentadas para o anúncio."}, {"seg": "Eletricidade", "id": "E5", "titulo": "Energy manager de siderurgia", "nome": "António Barros", "cargo": "Energy manager", "empresa": "Ferronorte, siderurgia com forno elétrico de arco", "desc": "A energia é o maior custo da empresa. Discute perfil horário, preço e flexibilidade ao detalhe.", "briefing": "Vai reunir com António Barros, energy manager da Ferronorte, siderurgia com forno elétrico de arco, ligada em alta tensão, com consumo na ordem das centenas de GWh por ano. O contrato atual é indexado ao mercado grossista.", "objetivo": "Sair com o acordo para desenhar em conjunto uma proposta para o próximo contrato.", "objecao": "Quero indexado ao mercado com o spread mais baixo possível. É só isso que compara.", "real": "A produção consegue concentrar o consumo nas horas mais baratas, mas o contrato atual não dá qualquer benefício por isso. Quer ser recompensado pela flexibilidade e começar a estudar um contrato de longo prazo com produção renovável.", "pistas": "\"nós conseguimos mexer no plano de produção\"; \"de que serve ser flexível se pago o mesmo\"; \"a administração quer saber o que fazemos para estabilizar o custo a longo prazo\"", "cede": "O vendedor mostra domínio técnico, descobre o valor da flexibilidade e propõe uma estrutura que a remunere (preço por perfil horário, partilha de valor) e um caminho para uma componente de longo prazo com renovável.", "fecha": "Mostrar desconhecimento do mercado grossista; tratar a siderurgia como um cliente comum; prometer valores sem fundamento.", "estilo": "Muito técnico, direto, impaciente com generalidades.", "pro": true, "ex": "Está também presente Joana Duarte, diretora financeira, que só quer previsibilidade orçamental e desconfia de estruturas complexas; tu e ela discordam à frente do vendedor (fala também por ela, identificando quem fala). Segunda preocupação escondida: a empresa avalia investir num novo forno e a decisão depende do custo de energia esperado a dez anos. Pressão: reunião com outro fornecedor no dia seguinte. Encerram ao segundo erro grave, como tomar partido de um dos dois ou propor antes de perceber o que cada um precisa. Cedem se o vendedor combinar remuneração da flexibilidade com uma componente de preço estável a longo prazo e descobrir a ligação com a decisão de investimento."}, {"seg": "Gás natural", "id": "G1", "titulo": "Diretor de produção de panificação industrial", "nome": "Luís Ferreira", "cargo": "Diretor de produção", "empresa": "Panificadora do Oeste, Torres Vedras", "desc": "O gás é o coração da produção. O consumo varia muito ao longo do ano.", "briefing": "Vai reunir com Luís Ferreira, diretor de produção da Panificadora do Oeste, em Torres Vedras, com fornos a gás em laboração contínua. O contrato de gás natural termina em dois meses.", "objetivo": "Sair com o acordo para uma proposta de fornecimento de gás natural a 24 meses.", "objecao": "O preço do gás é o que é. Quero o mais barato.", "real": "O consumo varia muito ao longo do ano, com picos no Natal e na Páscoa e quebras no verão. No contrato atual pagou penalizações por consumir fora da banda de volume contratada, numa cláusula que ninguém lhe explicou. O preço unitário importa menos do que o custo total com essas penalizações.", "pistas": "\"no Natal produzimos o triplo\"; \"o ano passado veio uma fatura com uma coisa que eu nem sabia que existia\"", "cede": "O vendedor descobre as penalizações e propõe um contrato com banda de volume larga ou sem penalização por desvio, ajustada à sazonalidade, mesmo com um preço unitário ligeiramente acima do mais barato.", "fecha": "Falar só de preço por kWh; não saber explicar as cláusulas de volume; prometer melhorias de abastecimento, que dependem da rede de distribuição e não do comercializador.", "estilo": "Homem de fábrica, prático, impaciente com conversa comercial.", "pro": false, "ex": "Está também presente o dono da empresa, que só quer o preço mais baixo e desconfia de comerciais (fala também por ele, identificando quem fala). Há uma proposta concorrente 5% mais barata, com banda de volume ainda mais apertada. Segunda preocupação escondida: a empresa vai abrir uma segunda linha de produção dentro de um ano, o que aumenta o consumo, e o contrato tem de acomodar esse crescimento. Encerram ao segundo erro grave. Cedem se o vendedor mostrar ao dono o custo das penalizações por desvio na proposta mais barata e propuser banda larga com revisão para a nova linha."}, {"seg": "Gás natural", "id": "G2", "titulo": "Diretora industrial de cerâmica", "nome": "Paula Rocha", "cargo": "Diretora industrial", "empresa": "Cerâmica Lis, Leiria", "desc": "Consumo elevado e margens apertadas. Sofreu com a volatilidade dos últimos anos.", "briefing": "Vai reunir com Paula Rocha, diretora industrial da Cerâmica Lis, em Leiria, com fornos de cozedura a gás, que exporta 70% da produção.", "objetivo": "Sair com o acordo para uma proposta com uma estrutura de preço adaptada.", "objecao": "Depois do que passámos com os preços do gás, quero preço fixo e mais nada.", "real": "Os clientes estrangeiros negoceiam preços em contratos anuais; ela precisa de alinhar o custo do gás com esse calendário. Um fixo a 24 meses não coincide com o ciclo comercial e pode deixá-la em desvantagem se os preços caírem.", "pistas": "\"os nossos clientes revêem preços em janeiro\"; \"perdemos uma encomenda para Espanha por causa do preço\"", "cede": "O vendedor liga o contrato ao ciclo comercial dela, por exemplo preço fixo por ano civil, com revisão alinhada com as negociações dos clientes.", "fecha": "Insistir num prazo longo sem perceber o negócio; desvalorizar a pressão da concorrência espanhola.", "estilo": "Técnica, analítica, desconfiada de soluções chave na mão.", "pro": false, "ex": "Há uma proposta concorrente de preço fixo a 24 meses, 6% abaixo do mercado atual, que a administração acha imbatível. Está presente o diretor comercial da Cerâmica Lis, preocupado com a perda de encomendas para Espanha (fala também por ele, identificando quem fala). Segunda preocupação escondida: a empresa estuda um forno híbrido a hidrogénio verde para daqui a três anos e não quer um contrato de gás que a prenda além disso. Encerram ao segundo erro grave. Cedem se o vendedor alinhar o preço com o ciclo comercial anual, explicar o risco do fixo longo se os preços caírem e oferecer um contrato que acomode a transição."}, {"seg": "Gás natural", "id": "G3", "titulo": "Gerente de lavandaria industrial", "nome": "Abel Pacheco", "cargo": "Gerente", "empresa": "LavaMais, lavandaria industrial na Maia", "desc": "Trabalha para hospitais e hotéis. Cada cêntimo por kWh conta na sua margem.", "briefing": "Vai reunir com Abel Pacheco, gerente da LavaMais, lavandaria industrial na Maia que serve hospitais e hotéis, com caldeiras e secadores a gás.", "objetivo": "Sair com o acordo para uma proposta com auditoria energética incluída.", "objecao": "Cada cêntimo por kWh conta. Mostre-me o preço.", "real": "Os contratos com os hospitais têm preço fechado por quilo de roupa durante três anos; o gás é a variável que lhe destrói a margem. As caldeiras são antigas e ele sabe que desperdiça energia, mas não tem dinheiro para investir.", "pistas": "\"os hospitais não aceitam revisões de preço\"; \"as caldeiras já têm quinze anos\"", "cede": "O vendedor descobre o problema da margem e propõe preço estável combinado com uma solução de eficiência nas caldeiras, financiada ou paga com a poupança.", "fecha": "Propor um investimento que ele não pode pagar; ignorar o contrato com os hospitais.", "estilo": "Faz contas de cabeça, direto, fala depressa.", "pro": false, "ex": "Está também presente o sócio da LavaMais, que quer vender a empresa em dois anos e só pensa no EBITDA (fala também por ele, identificando quem fala). Há uma proposta concorrente mais barata, mas indexada e sem qualquer componente de eficiência. Segunda preocupação escondida: um dos hospitais está a renegociar o contrato e ameaça sair se o preço por quilo subir. Encerram ao segundo erro grave. Cedem se o vendedor mostrar ao sócio o efeito no EBITDA de um preço estável com eficiência nas caldeiras paga com a poupança, sem investimento inicial."}, {"seg": "Gás natural", "id": "G4", "titulo": "Diretora de hotel com spa", "nome": "Margarida Lopes", "cargo": "Diretora", "empresa": "Hotel Serra & Spa, Serra da Estrela", "desc": "Piscina aquecida e lavandaria. Quer reduzir custos sem afetar a experiência dos hóspedes.", "briefing": "Vai reunir com Margarida Lopes, diretora do Hotel Serra & Spa, na Serra da Estrela, com piscina interior aquecida, spa e lavandaria própria.", "objetivo": "Sair com o acordo para uma proposta de gás natural com serviços associados.", "objecao": "Recebi uma proposta mais barata. Se não igualarem, mudo.", "real": "O grupo proprietário quer que o hotel obtenha uma certificação de turismo sustentável no próximo ano, e ela não sabe como reduzir a pegada do aquecimento sem afetar a experiência dos hóspedes.", "pistas": "\"o grupo anda com uma certificação na cabeça\"; \"os hóspedes vêm pela piscina quente\"", "cede": "O vendedor descobre a certificação e propõe um caminho credível: gás com compensação certificada no curto prazo e um estudo de bomba de calor ou solar térmico para a piscina.", "fecha": "Igualar o preço de imediato; sugerir baixar a temperatura da piscina.", "estilo": "Cordial, orientada para o cliente, decide com o grupo.", "pro": false, "ex": "Está presente o diretor de sustentabilidade do grupo proprietário, por videochamada, que quer um plano concreto para a certificação e desconfia de compensações de carbono (fala também por ele, identificando quem fala). A proposta concorrente é 7% mais barata e inclui uma bomba de calor financiada. Segunda preocupação escondida: o hotel vai fechar dois meses no próximo inverno para obras, o que reduz muito o consumo. Encerram ao segundo erro grave, como prometer neutralidade carbónica só com compensações. Cedem se o vendedor apresentar um plano credível de redução real (bomba de calor ou solar térmico), flexibilidade de volume durante as obras e comparar as duas propostas no custo total."}, {"seg": "Gás natural", "id": "G5", "titulo": "Diretor de fábrica de vidro", "nome": "Fernando Gaspar", "cargo": "Diretor", "empresa": "Vidreira do Atlântico, Marinha Grande", "desc": "Fornos em funcionamento contínuo. Quer uma estratégia de preço a vários anos.", "briefing": "Vai reunir com Fernando Gaspar, diretor da Vidreira do Atlântico, na Marinha Grande, com fornos de fusão em funcionamento contínuo e consumo muito elevado de gás natural.", "objetivo": "Sair com o acordo para desenhar uma proposta plurianual.", "objecao": "Quero indexado ao mercado de referência com o spread mais baixo do mercado.", "real": "Um dos fornos chega ao fim de vida e vai ser reconstruído, o que o deixa parado vários meses e reduz o consumo de forma significativa. A administração precisa de uma estratégia de preço a três anos para decidir o investimento, e um contrato com volume mínimo rígido penalizaria a fábrica durante a obra.", "pistas": "\"temos uma decisão de investimento em cima da mesa\"; \"um forno destes não dura para sempre\"", "cede": "O vendedor mostra domínio do mercado, propõe indexado com coberturas parciais a prazo e flexibilidade de volume durante a reconstrução, e liga a proposta à decisão de investimento.", "fecha": "Tratar a fábrica como um cliente comum; desconhecer as referências de mercado do gás; prometer garantias de abastecimento físico, que são da rede de distribuição.", "estilo": "Técnico, sereno, muito exigente.", "pro": true, "ex": "Está também presente o diretor financeiro do grupo, que quer previsibilidade total e desconfia de coberturas (fala também por ele, identificando quem fala). Há uma proposta concorrente com spread mais baixo, mas com volume mínimo anual rígido e penalização por consumo abaixo desse volume. Segunda preocupação escondida: o grupo pondera eletrificar parcialmente um forno nos próximos anos, o que reduziria ainda mais o consumo de gás. Encerram ao segundo erro grave, como tomar partido de um dos dois interlocutores."}, {"seg": "Dual offer", "id": "D1", "titulo": "Diretor de operações agroalimentar", "nome": "Henrique Vaz", "cargo": "Diretor de operações", "empresa": "Frescos do Ribatejo, Santarém", "desc": "Frio industrial e caldeiras. Quer saber se o pacote compensa mesmo, linha a linha.", "briefing": "Vai reunir com Henrique Vaz, diretor de operações da Frescos do Ribatejo, em Santarém, processamento de legumes com frio industrial (eletricidade) e caldeiras de vapor (gás natural).", "objetivo": "Sair com o acordo para uma proposta dual de eletricidade e gás a 24 meses.", "objecao": "Pacotes são sempre para esconder alguma coisa. Quero ver cada energia em separado, linha a linha.", "real": "Já teve um pacote dual em que o desconto do gás desapareceu ao fim de um ano, numa revisão que ninguém lhe explicou. Desconfia da opacidade, não do pacote em si.", "pistas": "\"no outro fornecedor o desconto evaporou\"; \"ninguém me soube explicar a fatura\"", "cede": "O vendedor descobre a má experiência e propõe preços separados e transparentes por energia, com o desconto dual explícito e fixo durante todo o contrato.", "fecha": "Insistir no preço global sem detalhe; usar o desconto como argumento principal.", "estilo": "Desconfiado, metódico, quer tudo por escrito.", "pro": false, "ex": "Está também presente a diretora financeira, que quer um pacote único e simples, ao contrário do Henrique, que quer tudo separado (fala também por ela, identificando quem fala). Há uma proposta concorrente dual com desconto de 8% no primeiro ano, sem garantia nos anos seguintes. Segunda preocupação escondida: a empresa vai instalar uma caldeira de biomassa que reduz o consumo de gás a metade dentro de 18 meses. Encerram ao segundo erro grave, como tomar partido de um deles. Cedem se o vendedor propuser preços separados e transparentes com desconto dual fixo e flexibilidade de volume no gás para a transição."}, {"seg": "Dual offer", "id": "D2", "titulo": "Diretora financeira de grupo de retalho alimentar", "nome": "Cláudia Reis", "cargo": "Diretora financeira", "empresa": "Grupo MercaBom, 18 supermercados e 2 armazéns", "desc": "Lojas e armazéns com eletricidade e gás. Quer um único fornecedor, mas desconfia de pacotes.", "briefing": "Vai reunir com Cláudia Reis, diretora financeira do grupo MercaBom, com 18 supermercados e 2 armazéns no Centro, eletricidade em todos os locais e gás em 6 lojas com padaria.", "objetivo": "Sair com o acordo para uma proposta dual consolidada.", "objecao": "Quero um único fornecedor, mas o preço tem de ser igual ou melhor em cada uma das energias.", "real": "Está a preparar a entrada de um fundo no capital do grupo e precisa de mostrar custos operacionais controlados e processos simples; o número de contratos e faturas é um sinal de desorganização na auditoria.", "pistas": "\"estamos a arrumar a casa\"; \"vai haver uma auditoria em breve\"", "cede": "O vendedor percebe o contexto da auditoria e propõe consolidação contratual, faturação única e relatórios de custos por loja, com preço competitivo.", "fecha": "Focar só no preço por energia; perguntar diretamente pelo fundo de forma invasiva.", "estilo": "Rigorosa, rápida, pouco tempo.", "pro": false, "ex": "Está também presente o representante do fundo que vai entrar no capital, que avalia a qualidade da gestão (fala também por ele, identificando quem fala). Há uma proposta concorrente com preço mais baixo, mas com dois contratos e duas faturas. Segunda preocupação escondida: o grupo pretende fechar duas lojas pouco rentáveis depois da entrada do fundo, e o contrato não pode ter penalizações por saída de locais. Encerram ao segundo erro grave. Cedem se o vendedor mostrar ao fundo a simplicidade de gestão (um contrato, uma fatura, relatórios por loja) e oferecer saída de locais sem penalização."}, {"seg": "Dual offer", "id": "D3", "titulo": "Diretor de cadeia de ginásios", "nome": "Bruno Neves", "cargo": "Diretor de operações", "empresa": "FitUrban, 12 ginásios em Lisboa e Porto", "desc": "12 espaços em expansão. Foco no custo por clube.", "briefing": "Vai reunir com Bruno Neves, diretor de operações da FitUrban, com 12 ginásios em Lisboa e Porto, climatização, piscinas e balneários a gás.", "objetivo": "Sair com o acordo para uma proposta dual para toda a rede.", "objecao": "O custo por clube é o que conta. Quero o mais baixo possível.", "real": "Vai abrir 8 clubes nos próximos 2 anos e precisa de um contrato que integre novos locais rapidamente, com as mesmas condições, sem negociar cada abertura.", "pistas": "\"estamos em expansão\"; \"cada abertura é uma dor de cabeça com contratos\"", "cede": "O vendedor descobre a expansão e propõe um contrato-quadro com adesão automática de novos clubes às mesmas condições e ligação rápida.", "fecha": "Propor um contrato rígido só para os 12 locais atuais; ignorar os prazos de abertura.", "estilo": "Jovem, enérgico, orientado para indicadores.", "pro": false, "ex": "Está presente o CEO da FitUrban, que quer cortar custos já para apresentar resultados a investidores (fala também por ele, identificando quem fala). A proposta concorrente é 6% mais barata, mas obriga a negociar cada novo clube separadamente. Segunda preocupação escondida: dois dos clubes atuais vão ser transferidos para franchisados, que terão de ter contratos próprios. Encerram ao segundo erro grave. Cedem se o vendedor mostrar o custo de negociar cada abertura, propuser um contrato-quadro que integre novos clubes e permita ceder contratos a franchisados."}, {"seg": "Dual offer", "id": "D4", "titulo": "Administradora de hospital privado", "nome": "Isabel Coutinho", "cargo": "Administradora", "empresa": "Hospital Santa Clara do Minho, Braga", "desc": "Continuidade de fornecimento é obrigatória. Pouca disponibilidade para reuniões.", "briefing": "Vai reunir com a Dra. Isabel Coutinho, administradora do Hospital Santa Clara do Minho, em Braga, com blocos operatórios, esterilização e climatização, eletricidade e gás natural.", "objetivo": "Sair com o acordo para uma reunião com a direção técnica e uma proposta.", "objecao": "Não tenho tempo para mudar de fornecedor. O que tenho funciona.", "real": "A mudança de fornecedor assusta-a por causa do risco operacional, mas a direção pediu-lhe uma redução de 8% nos custos de estrutura. Precisa de uma mudança sem riscos nem trabalho para a equipa.", "pistas": "\"num hospital não se pode falhar\"; \"a direção quer cortes em tudo\"", "cede": "O vendedor mostra que a mudança de comercializador não afeta o fornecimento físico, assume toda a gestão da mudança e quantifica a poupança face à meta.", "fecha": "Desvalorizar o risco percebido; pedir muito tempo ou documentos à equipa.", "estilo": "Formal, ocupada, interrompida por chamadas.", "pro": false, "ex": "Está também presente o diretor técnico do hospital, que desconfia de qualquer mudança e faz perguntas sobre continuidade e emergências (fala também por ele, identificando quem fala). Há uma proposta concorrente 5% mais barata. Segunda preocupação escondida: o hospital vai abrir uma nova ala de radioterapia, com consumo elevado e sensível, dentro de um ano. Encerram ao segundo erro grave, como prometer garantias de fornecimento físico que dependem da rede. Cedem se o vendedor explicar com rigor que o comercializador não altera o fornecimento físico, assumir toda a gestão da mudança e incluir a nova ala com acompanhamento técnico."}, {"seg": "Dual offer", "id": "D5", "titulo": "Diretor industrial de fábrica de papel", "nome": "Joaquim Serra", "cargo": "Diretor industrial", "empresa": "Papelaria do Tejo, Vila Velha de Ródão", "desc": "Grande consumidor de eletricidade e gás. Quer coordenar os dois contratos.", "briefing": "Vai reunir com Joaquim Serra, diretor industrial da Papelaria do Tejo, em Vila Velha de Ródão, com máquinas de papel (eletricidade) e secagem a vapor (gás), e cogeração própria.", "objetivo": "Sair com o acordo para desenhar uma proposta integrada.", "objecao": "Quero os dois contratos separados, com o melhor preço em cada um. Pacotes não servem a uma fábrica como esta.", "real": "A cogeração está no fim de vida e tem de decidir se a substitui ou se passa a comprar mais eletricidade à rede. Os dois contratos dependem um do outro, e ninguém o ajudou a pensar nisso em conjunto.", "pistas": "\"a cogeração já deu o que tinha a dar\"; \"compro gás para fazer eletricidade, ou eletricidade diretamente?\"", "cede": "O vendedor descobre a decisão sobre a cogeração e propõe uma análise integrada dos cenários, com contratos flexíveis em volume durante a transição.", "fecha": "Propor um pacote padrão; desconhecer o que é cogeração.", "estilo": "Engenheiro, minucioso, pensa em décadas.", "pro": true, "ex": "O diretor financeiro do grupo participa por videochamada e quer decidir já, pelo preço (fala também por ele, identificando quem fala). Há uma proposta concorrente só para eletricidade, 4% mais barata, com volume mínimo garantido. Segunda preocupação escondida: o grupo candidatou-se a apoios para substituir a cogeração por uma caldeira elétrica, e a decisão sai dentro de seis meses. Encerram ao segundo erro grave."}, {"seg": "Produtos sofisticados", "id": "S1", "titulo": "CFO de grupo industrial", "nome": "Ana Valente", "cargo": "CFO", "empresa": "Grupo Metalis, três fábricas de componentes metálicos no Norte", "desc": "Avesso ao risco. Precisa de explicar a fórmula ao conselho sem parecer especulação.", "briefing": "Vai reunir com Ana Valente, CFO do Grupo Metalis, com três fábricas de componentes metálicos no Norte e consumo elevado em média tensão. O produto em discussão é um contrato indexado ao mercado grossista mais um spread, com coberturas a prazo de parte do volume.", "objetivo": "Sair com o acordo para apresentar a estrutura à comissão executiva.", "objecao": "Fórmulas e coberturas parecem especulação. O conselho nunca vai aprovar isso.", "real": "Ela própria percebe as vantagens, mas não consegue explicá-las ao conselho de forma simples, e teme ficar associada a uma decisão de risco se o mercado se mover contra.", "pistas": "\"eu até percebo, o problema é explicar\"; \"se correr mal, a culpa é de quem propôs\"", "cede": "O vendedor propõe uma política de coberturas com regras pré-definidas (por exemplo, fixar uma percentagem do volume em cada trimestre) e prepara com ela uma explicação de uma página para o conselho.", "fecha": "Usar jargão sem explicar; apresentar as coberturas como forma de ganhar dinheiro.", "estilo": "Inteligente, prudente, gosta de estrutura.", "pro": false, "ex": "Está presente o presidente do conselho de administração, que teve uma má experiência com derivados financeiros noutra empresa (fala também por ele, identificando quem fala). Há uma proposta concorrente de preço fixo a três anos, simples de explicar. Segunda preocupação escondida: o grupo está a negociar a compra de uma quarta fábrica e quer uma estrutura que a possa integrar. Encerram ao segundo erro grave, como apresentar coberturas como ganho. Cedem se o vendedor explicar a política de coberturas como gestão de risco com regras fixas, comparar o custo escondido do fixo e mostrar como a nova fábrica entra na mesma estrutura."}, {"seg": "Produtos sofisticados", "id": "S2", "titulo": "Diretor de compras de indústria química", "nome": "Sérgio Matias", "cargo": "Diretor de compras", "empresa": "Químicos do Sado, Setúbal", "desc": "Compara três propostas numa folha de cálculo e quer números, não argumentos.", "briefing": "Vai reunir com Sérgio Matias, diretor de compras da Químicos do Sado, em Setúbal, que está a comparar três propostas indexadas de eletricidade numa folha de cálculo.", "objetivo": "Ficar na lista final e obter uma segunda reunião técnica.", "objecao": "O vosso spread é o mais alto dos três. Explique-me porquê ou baixe-o.", "real": "As três propostas não são comparáveis (perfis de consumo, desvios e custos de ajuste tratados de forma diferente) e ele sabe-o, mas não tem tempo para as normalizar; precisa de uma comparação justa que possa defender.", "pistas": "\"cada um apresenta à sua maneira\"; \"tenho de entregar isto ao diretor-geral na sexta\"", "cede": "O vendedor, sem atacar os concorrentes, propõe uma grelha de comparação normalizada e mostra onde os custos aparecem em cada fórmula.", "fecha": "Baixar o spread de imediato; dizer que os concorrentes escondem custos sem o demonstrar.", "estilo": "Números acima de tudo, seco, pede dados.", "pro": false, "ex": "Está também presente o diretor-geral, que quer saber só qual é a proposta mais barata e decidir na reunião (fala também por ele, identificando quem fala). Um dos concorrentes baixou o spread na véspera. Segunda preocupação escondida: o Sérgio desconfia que a proposta mais barata tem custos de desvio escondidos, mas não quer parecer que defende a Lumina à frente do chefe. Encerram ao segundo erro grave, como atacar os concorrentes. Cedem se o vendedor, com uma grelha normalizada, mostrar o custo total de cada proposta no perfil real da fábrica e der ao Sérgio argumentos neutros para defender a escolha."}, {"seg": "Produtos sofisticados", "id": "S3", "titulo": "Diretora financeira de grupo de centros comerciais", "nome": "Patrícia Lemos", "cargo": "Diretora financeira", "empresa": "Atrium Retail, gestora de 5 centros comerciais", "desc": "Vários ativos com consumos diferentes. Quer proteger o orçamento sem perder flexibilidade.", "briefing": "Vai reunir com Patrícia Lemos, diretora financeira da Atrium Retail, gestora de 5 centros comerciais em Portugal, com consumo agregado elevado.", "objetivo": "Sair com o acordo para propor uma estratégia de coberturas para os 5 ativos.", "objecao": "Precisamos de proteger o orçamento. Fixo para tudo, três anos.", "real": "Um dos centros pode ser vendido no próximo ano e outros dois vão ter obras de eficiência que reduzirão o consumo; um fixo rígido a três anos para tudo deixá-la-ia com volume contratado que não vai usar.", "pistas": "\"o portefólio pode mudar\"; \"temos projetos de eficiência em curso\"", "cede": "O vendedor descobre as mudanças no portefólio e propõe coberturas parciais e progressivas, com flexibilidade de volume e cessão por ativo.", "fecha": "Propor fixar 100% do volume a três anos; ignorar as obras de eficiência.", "estilo": "Estratégica, analítica, pensa em portefólio.", "pro": false, "ex": "Está presente o CEO da Atrium Retail, que quer um orçamento fechado e não gosta de surpresas (fala também por ele, identificando quem fala). Há uma proposta concorrente de preço fixo a três anos para todo o portefólio, 3% abaixo do mercado. Segunda preocupação escondida: a venda de um dos centros já está acordada em princípio e será anunciada dentro de seis meses. Encerram ao segundo erro grave. Cedem se o vendedor mostrar o risco de fixar volume que não vai ser usado, propuser coberturas progressivas e cessão de contrato por ativo, e der ao CEO um orçamento com intervalo garantido."}, {"seg": "Produtos sofisticados", "id": "S4", "titulo": "Energy manager de cimenteira", "nome": "Vasco Almeida", "cargo": "Energy manager", "empresa": "Cimentos do Norte", "desc": "Conhece os mercados a fundo. Quer discutir a fórmula, os spreads e as coberturas.", "briefing": "Vai reunir com Vasco Almeida, energy manager da Cimentos do Norte, fábrica com consumo de centenas de GWh por ano, operação contínua e flexibilidade nos moinhos.", "objetivo": "Sair com o acordo para desenhar uma fórmula à medida.", "objecao": "Quero discutir a fórmula linha a linha: índice, spread, custos de ajuste, perfil. E quero comprar coberturas quando eu decidir, não quando vocês quiserem.", "real": "A fábrica consegue deslocar o consumo dos moinhos para horas baratas, mas a fórmula atual usa um perfil médio e não reflete isso. Quer uma fórmula com preço horário e autonomia para gerir coberturas.", "pistas": "\"os moinhos podem trabalhar de noite\"; \"pago um perfil que não é o meu\"", "cede": "O vendedor domina a mecânica de mercado, propõe preço horário real e um processo de coberturas em que o cliente decide os momentos dentro de regras acordadas.", "fecha": "Errar conceitos de mercado; propor coberturas obrigatórias em datas fixas.", "estilo": "Muito técnico, testa o vendedor com perguntas difíceis.", "pro": true, "ex": "O diretor-geral entra a meio da reunião e diz que quer 'ganhar dinheiro com as coberturas este ano' (fala também por ele, identificando quem fala). O vendedor tem de gerir a expectativa sem contrariar publicamente o diretor-geral nem perder o energy manager. Segunda preocupação escondida: a fábrica está a estudar um contrato de longo prazo com um parque solar e a fórmula tem de ser compatível com essa futura entrada. Encerram ao segundo erro grave, como prometer ganhos."}, {"seg": "Produtos sofisticados", "id": "S5", "titulo": "Comprador eletrointensivo com consultor", "nome": "Manuel Brito", "cargo": "Diretor de compras", "empresa": "Fundição Atlântica, Ovar, acompanhado por Nádia Fontes, consultora de energia", "desc": "Dois interlocutores, e a consultora quer mostrar trabalho ao cliente.", "briefing": "Vai reunir com Manuel Brito, diretor de compras da Fundição Atlântica, em Ovar, acompanhado por Nádia Fontes, consultora de energia contratada para o concurso. Representas os dois, identificando quem fala.", "objetivo": "Passar à fase final do concurso.", "objecao": "(dita pela consultora) A vossa fórmula tem custos que não estão explícitos. Ou os separam, ou estão fora.", "real": "O diretor de compras quer uma decisão rápida e segura; a consultora quer mostrar valor ao cliente encontrando falhas. Ele está cansado do processo e precisa de um fornecedor que facilite a vida, sem desautorizar a consultora.", "pistas": "(do diretor) \"isto já vai na terceira ronda\"; \"preciso de fechar até ao fim do trimestre\"", "cede": "O vendedor responde com rigor às questões técnicas da consultora, reconhece o trabalho dela e, ao mesmo tempo, dá ao diretor um caminho simples para decidir.", "fecha": "Ignorar ou contrariar a consultora; falar só com o diretor.", "estilo": "Ele pragmático e cansado; ela exigente e técnica.", "pro": true, "ex": "A consultora tem uma ligação comercial a um concorrente, que o vendedor pode inferir mas não deve acusar. Segunda preocupação do diretor: precisa de um contrato que permita reduzir consumo se uma linha de produção fechar. Encerram ao segundo erro grave."}, {"seg": "Autoconsumo individual", "id": "A1", "titulo": "CFO cético de indústria", "nome": "Helena Matos", "cargo": "CFO", "empresa": "Embalagens Lis, Leiria", "desc": "Já foi desiludida por um instalador. Quer números em que possa confiar.", "briefing": "Vai reunir com Helena Matos, CFO da Embalagens Lis, empresa de embalagens de cartão em Leiria, com 180 trabalhadores, dois turnos e uma fatura elétrica significativa. O administrador mostrou interesse em fazer alguma coisa na área da sustentabilidade. O produto é uma instalação solar de autoconsumo, sem injeção de excedentes na rede.", "objetivo": "Sair com o acordo da Helena para um estudo técnico no local.", "objecao": "Quanto custa e em quantos anos se paga?", "real": "Um instalador anterior prometeu poupanças que não apareceram na fatura. A sua preocupação é a credibilidade das estimativas. Os clientes começam a pedir relatórios de pegada carbónica.", "pistas": "\"a última empresa também me falou em garantias\"; \"números que sejam meus\"; os clientes pedem relatórios de pegada carbónica", "cede": "O vendedor explora a má experiência e propõe um estudo com os consumos reais dos últimos 12 meses, com garantia sobre essa estimativa.", "fecha": "Baixar o preço logo; dizer que é fácil chegar à poupança; acrescentar complexidade sem responder à dúvida.", "estilo": "Direta, com pressa, desconfiada mas justa.", "pro": false, "ex": "Está também presente o administrador, entusiasmado com a sustentabilidade, que quer avançar já sem estudo (fala também por ele, identificando quem fala). Há uma proposta concorrente com um preço por kWp mais baixo e promessas de poupança de 40%. Segunda preocupação escondida: a empresa vai mudar de instalações dentro de cinco anos e não sabe se a cobertura atual se mantém. Encerram ao segundo erro grave, como prometer percentagens de poupança sem dados. Cedem se o vendedor travar o entusiasmo com rigor, propuser estudo com dados reais e um modelo que permita transferir ou desmontar a instalação."}, {"seg": "Autoconsumo individual", "id": "A2", "titulo": "Diretor de armazém logístico", "nome": "Pedro Saraiva", "cargo": "Diretor de operações", "empresa": "LogiCentro, armazém de 30 000 m² na Azambuja", "desc": "Grande cobertura e consumo diurno. A cobertura é arrendada.", "briefing": "Vai reunir com Pedro Saraiva, diretor de operações da LogiCentro, armazém de 30 000 m² na Azambuja, com consumo diurno elevado (iluminação, empilhadores elétricos, frio). O produto é uma instalação solar de autoconsumo, em compra ou em modelo de serviço sem investimento.", "objetivo": "Sair com o acordo para um estudo de viabilidade.", "objecao": "Não somos donos do edifício. Não vou investir num telhado que não é meu.", "real": "No modelo de serviço, teme ficar preso durante muitos anos a um preço por kWh fixo que acabe acima do preço da energia da rede, se o mercado descer. Já viu isso acontecer a uma empresa vizinha. O prazo do arrendamento (7 anos) agrava o receio.", "pistas": "\"o vizinho do lado arrependeu-se\"; \"e se a eletricidade da rede ficar mais barata?\"; \"o contrato com o senhorio tem prazo\"", "cede": "O vendedor descobre o receio de pagar mais do que a rede e propõe um preço do solar indexado ao preço da rede com desconto garantido, ou um preço fixo com cláusula de revisão, com prazo alinhado com o arrendamento e apresentação conjunta ao senhorio.", "fecha": "Garantir que o solar é sempre mais barato; propor um preço fixo a 15 ou 20 anos sem proteção; ignorar o papel do senhorio.", "estilo": "Pragmático, pensa em custos por palete.", "pro": false, "ex": "Está presente um representante do senhorio, um fundo imobiliário, que quer valorizar o edifício mas não aceita encargos (fala também por ele, identificando quem fala). Há uma proposta concorrente de modelo de serviço a 20 anos com preço fixo baixo. Segunda preocupação escondida: a LogiCentro pondera mudar-se para um armazém maior dentro de quatro anos. Encerram ao segundo erro grave. Cedem se o vendedor propuser preço indexado à rede com desconto garantido, contrato alinhado com o arrendamento, com possibilidade de cessão ao senhorio ou a um novo inquilino."}, {"seg": "Autoconsumo individual", "id": "A3", "titulo": "Diretora de expansão de cadeia de supermercados", "nome": "Raquel Monteiro", "cargo": "Diretora de expansão e manutenção", "empresa": "FrescoMais, 30 supermercados de proximidade", "desc": "Frio ligado 24 horas. Quer saber quanto poupa de facto à noite.", "briefing": "Vai reunir com Raquel Monteiro, diretora de expansão e manutenção da FrescoMais, com 30 supermercados de proximidade. O produto é solar de autoconsumo para as lojas.", "objetivo": "Sair com o acordo para um projeto-piloto em 3 lojas.", "objecao": "O frio trabalha 24 horas. O solar só ajuda de dia. Não compensa.", "real": "Quer um projeto replicável em toda a rede, mas cada loja tem telhado, orientação e consumo diferentes; teme acabar com 30 projetos diferentes para gerir.", "pistas": "\"cada loja é um caso\"; \"não tenho equipa para acompanhar trinta obras\"", "cede": "O vendedor mostra que o consumo diurno do frio e da iluminação chega para uma boa taxa de autoconsumo e propõe um modelo padronizado com piloto em 3 lojas e gestão centralizada.", "fecha": "Prometer poupanças iguais em todas as lojas; desvalorizar o consumo noturno.", "estilo": "Organizada, pensa em escala.", "pro": false, "ex": "Está presente o diretor financeiro da FrescoMais, que só aprova projetos com retorno abaixo de cinco anos (fala também por ele, identificando quem fala). Há uma proposta concorrente para as 30 lojas de uma vez, com desconto de volume. Segunda preocupação escondida: metade das lojas estão em edifícios arrendados com senhorios diferentes. Encerram ao segundo erro grave, como prometer o mesmo retorno em todas as lojas. Cedem se o vendedor propuser um piloto em lojas próprias com retorno medido, um modelo de serviço sem investimento para as arrendadas e um plano de expansão por fases."}, {"seg": "Autoconsumo individual", "id": "A4", "titulo": "Diretor técnico de centro comercial", "nome": "Gonçalo Pires", "cargo": "Diretor técnico", "empresa": "Centro Comercial Mondego, Coimbra", "desc": "Cobertura e parque de estacionamento disponíveis. Preocupa-se com obras e imagem.", "briefing": "Vai reunir com Gonçalo Pires, diretor técnico do Centro Comercial Mondego, em Coimbra, com grande cobertura e parque de estacionamento exterior. O produto é solar de autoconsumo na cobertura e no parque.", "objetivo": "Sair com o acordo para um estudo técnico da cobertura e do parque.", "objecao": "Obras no telhado e no parque com o centro aberto? Nem pensar.", "real": "A administração quer melhorar a classificação de sustentabilidade do edifício e ele foi encarregado de propor medidas; mas tem medo de queixas dos lojistas e dos clientes durante as obras.", "pistas": "\"a administração anda a falar de certificações\"; \"qualquer obra aqui dá queixas\"", "cede": "O vendedor descobre a meta de sustentabilidade e propõe um plano de obra faseado e noturno, com estruturas de sombreamento no parque como benefício visível para os clientes.", "fecha": "Minimizar o impacto das obras; não ter plano de execução.", "estilo": "Técnico, prudente, avesso a reclamações.", "pro": false, "ex": "Está presente a diretora do centro, responsável pela relação com os lojistas, que receia queixas durante as obras (fala também por ela, identificando quem fala). Há uma proposta concorrente mais barata, só para a cobertura, sem estruturas no parque. Segunda preocupação escondida: o parque de estacionamento vai ser parcialmente reconstruído dentro de três anos. Encerram ao segundo erro grave, como minimizar o impacto das obras. Cedem se o vendedor apresentar um plano de obra faseado e noturno, comunicação aos lojistas e uma solução para o parque compatível com a reconstrução."}, {"seg": "Autoconsumo individual", "id": "A5", "titulo": "Diretor de fábrica de plásticos", "nome": "Carlos Domingues", "cargo": "Diretor", "empresa": "InjetaPlás, Marinha Grande, fornecedor do setor automóvel", "desc": "O solar cobre uma parte pequena do consumo. O desafio é gerir expectativas.", "briefing": "Vai reunir com Carlos Domingues, diretor da InjetaPlás, na Marinha Grande, com máquinas de injeção a laborar 24 horas, consumo muito elevado, fornecedor de componentes para o setor automóvel. O produto é solar de autoconsumo.", "objetivo": "Sair com o acordo para um estudo integrado.", "objecao": "O solar cobre-me 5% do consumo. Não vale o trabalho.", "real": "Tem razão quanto à cobertura, mas os clientes do setor automóvel exigem metas de redução da pegada de CO2 e aplicam um preço interno por tonelada de CO2 na avaliação de propostas. Não descarbonizar tem um custo nos concursos, e ele ainda não fez essa conta.", "pistas": "\"os clientes alemães mandam questionários de sustentabilidade\"; \"no último concurso pediram-nos a pegada por peça\"; \"um concorrente já tem painéis\"", "cede": "O vendedor não exagera a poupança, reconhece os 5% e reposiciona o projeto em toneladas: quanto CO2 evita o solar no local, quanto evita a energia renovável certificada para o resto do consumo, e quanto vale essa redução ao preço por tonelada que os clientes aplicam.", "fecha": "Inflacionar a percentagem de cobertura; tratar o projeto só como poupança na fatura; fazer afirmações de pegada sem as quantificar.", "estilo": "Cético, direto, respeita quem é honesto com os números.", "pro": true, "ex": "Está também presente o responsável de qualidade, com o questionário do cliente automóvel na mão, que quer respostas concretas (fala também por ele, identificando quem fala). Há uma proposta concorrente que promete 20% de cobertura com uma instalação que não cabe no telhado. Segunda preocupação escondida: a fábrica pode precisar de reforçar a potência de ligação à rede para uma nova linha, e qualquer projeto tem de considerar isso. Encerram ao segundo erro grave."}, {"seg": "Autoconsumo coletivo e comunidades", "id": "C1", "titulo": "Gestor de parque empresarial", "nome": "Duarte Nogueira", "cargo": "Diretor-geral", "empresa": "Parque Tecnológico Vouga, 22 empresas", "desc": "Várias empresas com consumos diferentes. Precisa de um modelo de partilha que todas aceitem.", "briefing": "Vai reunir com Duarte Nogueira, diretor-geral do Parque Tecnológico Vouga, com 22 empresas instaladas e telhados disponíveis nos pavilhões comuns. O produto é autoconsumo coletivo, com partilha de energia entre as empresas do parque.", "objetivo": "Sair com o acordo para apresentar o projeto às empresas do parque.", "objecao": "Pôr 22 empresas de acordo sobre qualquer coisa é impossível.", "real": "A sociedade gestora quer novas fontes de receita e um argumento para atrair empresas; ele vê potencial, mas teme ficar com o ónus de gerir a comunidade e as reclamações.", "pistas": "\"temos pavilhões vazios para arrendar\"; \"quem é que gere isto depois?\"", "cede": "O vendedor propõe que a Lumina assuma a gestão da comunidade, com regras claras de adesão e saída, e mostra como o projeto valoriza o parque para atrair inquilinos.", "fecha": "Deixar a gestão a cargo do parque; prometer adesão de todas as empresas.", "estilo": "Visão de negócio, receoso de trabalho extra.", "pro": false, "ex": "Estão presentes dois empresários do parque, um entusiasmado e outro cético, que discordam entre si (fala também por eles, identificando quem fala). Há uma proposta concorrente em que o parque teria de gerir a comunidade sozinho, mas com preço mais baixo. Segunda preocupação escondida: a sociedade gestora pondera vender parte dos pavilhões e não quer compromissos longos que dificultem a venda. Encerram ao segundo erro grave. Cedem se o vendedor assumir a gestão da comunidade, propuser regras de adesão e saída simples e um contrato transferível em caso de venda dos pavilhões."}, {"seg": "Autoconsumo coletivo e comunidades", "id": "C2", "titulo": "Empresa industrial com excedentes", "nome": "Teresa Vidal", "cargo": "Diretora financeira", "empresa": "TêxtilNorte, Guimarães", "desc": "Produz mais do que consome ao fim de semana e quer rentabilizar o excedente.", "briefing": "Vai reunir com Teresa Vidal, diretora financeira da TêxtilNorte, em Guimarães, com uma instalação solar grande que produz muito mais do que consome aos fins de semana. O produto é uma comunidade de energia com empresas vizinhas.", "objetivo": "Sair com o acordo para um estudo de uma comunidade com empresas vizinhas.", "objecao": "Já vendo os excedentes à rede. Para que é que preciso de complicar?", "real": "O preço que recebe pelos excedentes é baixo e volátil; partilhar com vizinhos a um preço acordado valeria mais, mas não quer depender da solvência de outras empresas.", "pistas": "\"o que me pagam pelos excedentes é uma miséria\"; \"e se o vizinho não paga?\"", "cede": "O vendedor compara o valor dos excedentes vendidos à rede com a partilha e propõe um modelo em que a Lumina assume o risco de cobrança aos participantes.", "fecha": "Ignorar o risco de crédito; prometer preços de partilha sem os fundamentar.", "estilo": "Cautelosa, pensa em risco.", "pro": false, "ex": "Estão presentes dois vizinhos interessados em receber a energia, que querem o preço mais baixo possível (fala também por eles, identificando quem fala). Há uma oferta concorrente de compra dos excedentes a preço fixo, por um agregador. Segunda preocupação escondida: a TêxtilNorte pode aumentar o consumo próprio com uma nova linha, reduzindo os excedentes disponíveis. Encerram ao segundo erro grave, como prometer aos vizinhos volumes que podem não existir. Cedem se o vendedor equilibrar o preço para a Teresa e para os vizinhos, assumir o risco de cobrança e prever regras para a variação dos excedentes."}, {"seg": "Autoconsumo coletivo e comunidades", "id": "C3", "titulo": "Diretor de centro comercial com lojistas", "nome": "Miguel Sá", "cargo": "Diretor", "empresa": "Centro Comercial Alameda, Faro, 90 lojas", "desc": "Quer partilhar energia com as lojas, mas cada lojista tem contrato e horário próprios.", "briefing": "Vai reunir com Miguel Sá, diretor do Centro Comercial Alameda, em Faro, com 90 lojas e instalação solar possível na cobertura. O produto é autoconsumo coletivo com os lojistas.", "objetivo": "Sair com o acordo para apresentar o modelo aos lojistas âncora.", "objecao": "Os lojistas têm contratos próprios. Não posso obrigá-los a nada.", "real": "Os lojistas reclamam do custo das despesas comuns e a renovação de três âncoras está próxima. Mas os âncoras, sobretudo as cadeias nacionais, compram a eletricidade centralmente e não aceitam mudar de comercializadora; ele teme que a comunidade seja vista como uma forma encapotada de os obrigar a contratar a Lumina.", "pistas": "\"os âncoras estão a renegociar\"; \"as despesas comuns são sempre o tema das reuniões\"; \"as cadeias grandes compram a energia na sede, em Lisboa\"", "cede": "O vendedor liga a comunidade à retenção dos lojistas, garante que a participação é independente do fornecimento de eletricidade (cada lojista mantém a sua comercializadora), propõe adesão voluntária com desconto claro e começa pelos âncoras.", "fecha": "Propor adesão obrigatória; condicionar a participação à mudança de comercializadora; ignorar os contratos de arrendamento.", "estilo": "Comercial, focado nos lojistas, otimista mas cauteloso.", "pro": false, "ex": "Está presente o gestor de conta de uma cadeia nacional âncora, que compra a energia centralmente e só aceita participar se não mexer no seu contrato de fornecimento (fala também por ele, identificando quem fala). Há uma proposta concorrente que exige a adesão de 70% dos lojistas para avançar. Segunda preocupação escondida: o centro vai ampliar a área comercial com mais 20 lojas dentro de dois anos. Encerram ao segundo erro grave, como condicionar a participação à mudança de comercializadora. Cedem se o vendedor garantir a independência do fornecimento, propuser adesão voluntária com arranque pelos âncoras e prever a entrada das novas lojas."}, {"seg": "Autoconsumo coletivo e comunidades", "id": "C4", "titulo": "Grupo de retalho com lojas próximas", "nome": "Sónia Cardoso", "cargo": "Diretora de operações", "empresa": "CasaViva, armazém central em Loures e 6 lojas próximas", "desc": "Quer partilhar a produção do armazém com as lojas da mesma zona.", "briefing": "Vai reunir com Sónia Cardoso, diretora de operações da CasaViva, com armazém central em Loures, de grande cobertura, e 6 lojas na área próxima. O produto é autoconsumo coletivo entre o armazém e as lojas.", "objetivo": "Sair com o acordo para um estudo de autoconsumo coletivo entre o armazém e as lojas.", "objecao": "Se é para pôr painéis, ponho no armazém e pronto. Para que partilhar?", "real": "O armazém só trabalha num turno e desperdiça produção à tarde e ao fim de semana, quando as lojas estão mais cheias; ela não sabe que pode aproveitar isso.", "pistas": "\"o armazém fecha às quatro\"; \"as lojas enchem ao sábado\"", "cede": "O vendedor pergunta pelos horários e mostra que a partilha aproveita a produção da tarde e do fim de semana nas lojas, com coeficientes ajustados ao perfil de cada local.", "fecha": "Propor só o autoconsumo individual sem analisar horários; complicar com jargão regulatório.", "estilo": "Prática, gosta de simplicidade.", "pro": false, "ex": "Está presente o diretor financeiro da CasaViva, que acha que a partilha é complicada demais e prefere autoconsumo individual em cada loja (fala também por ele, identificando quem fala). Há uma proposta concorrente de painéis em cada loja separadamente. Segunda preocupação escondida: o armazém pode passar a trabalhar em dois turnos dentro de um ano, o que reduz a energia disponível para partilhar. Encerram ao segundo erro grave. Cedem se o vendedor comparar com números o aproveitamento da partilha face às instalações separadas e propuser coeficientes de repartição revistos se o armazém mudar de horário."}, {"seg": "Autoconsumo coletivo e comunidades", "id": "C5", "titulo": "Indústria eletrointensiva âncora", "nome": "Rodrigo Leal", "cargo": "Energy manager", "empresa": "Aço Ibérico, siderurgia", "desc": "Seria o grande consumidor de uma comunidade com vários produtores.", "briefing": "Vai reunir com Rodrigo Leal, energy manager da Aço Ibérico, siderurgia com grande consumo, convidada a ser a consumidora âncora de uma comunidade com vários parques solares próximos.", "objetivo": "Sair com o acordo para negociar os termos de participação.", "objecao": "Só entro se tiver preço abaixo do mercado e volume garantido. Sou eu que dou viabilidade a isto.", "real": "Sabe que é indispensável e quer usar isso, mas precisa sobretudo de estabilidade de preço a longo prazo para justificar um investimento em eletrificação; um desconto pequeno com estabilidade vale-lhe mais do que um desconto grande e volátil.", "pistas": "\"sem nós isto não existe\"; \"a administração quer previsibilidade a dez anos\"", "cede": "O vendedor reconhece o poder negocial dele sem ceder tudo e propõe um preço estável de longo prazo com volume flexível dentro de limites.", "fecha": "Ceder um desconto grande de imediato; ignorar a dimensão de longo prazo.", "estilo": "Consciente do seu poder, duro, técnico.", "pro": true, "ex": "Dois representantes dos produtores solares participam e defendem os seus próprios interesses, como um preço mínimo garantido (fala também por eles, identificando quem fala). O vendedor tem de equilibrar o âncora e os produtores. Segunda preocupação escondida: a siderurgia pode reduzir a produção num cenário de crise do aço e precisa de uma cláusula de redução de volume. Encerram ao segundo erro grave, como prometer ao âncora condições que prejudiquem os produtores."}];

 ${isPro?`<div class="km"><div class="panel key"><span class="muted small">${t.said}</span><p class="cd" style="font-size:28px;line-height:1.2">“${esc(r.momento_chave&&r.momento_chave.citacao||"")}”</p><p class="muted">${esc(r.momento_chave&&r.momento_chave.porque||"")}</p></div>
 <div class="panel"><span class="muted small">${t.alt}</span><p style="font-size:19px">“${esc(r.frase_alternativa||"")}”</p></div></div>`:`<div class="panel key" style="position:relative;overflow:hidden;padding:26px;min-height:220px"><div class="blur" aria-hidden="true" style="display:flex;flex-direction:column;gap:12px"><p class="muted">${t.said}</p><p class="cd" style="font-size:28px">“${esc(r.momento_chave&&r.momento_chave.citacao||"")}”</p><p class="muted">${esc(r.frase_alternativa||"")}</p></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:color-mix(in srgb, var(--bg) 55%, transparent)"><strong style="font-size:19px">${t.blurT}</strong><span class="muted small">${t.blurP}</span><button class="btn primary" id="unlock">${t.unlock}</button></div></div>`}
 <h2 class="sec">${t.axes}</h2>
 <div class="dgrid">${r.dimensoes.slice(0,6).map((d,i)=>`<article class="panel dim"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3 style="font-size:24px">${esc(DIMS[LANG][i])}</h3><div style="display:flex;align-items:center;gap:10px"><div class="pips" aria-hidden="true">${[1,2,3,4,5].map(k=>`<i class="${k<=lv[i]?"on":""}"></i>`).join("")}</div><span class="cd" style="font-size:28px;color:var(--accent)">${lv[i]}</span></div></div>${isPro&&d.citacao?`<blockquote>“${esc(d.citacao)}”</blockquote>`:""}${isPro?`<p class="muted">${esc(d.comentario||"")}</p>`:""}</article>`).join("")}</div>
 ${isPro?`<section class="nextbox" aria-labelledby="nxt"><div style="display:flex;flex-direction:column;gap:6px"><span class="plan pro" style="align-self:flex-start">${LANG==="en"?"Focus for next time":LANG==="es"?"Foco para la próxima vez":"Foco para a próxima vez"}</span><h2 id="nxt" style="font-size:36px">${t.next}</h2><p class="muted">${LANG==="en"?"The three changes that will make the biggest difference in your next negotiation.":LANG==="es"?"Los tres cambios que más diferencia marcarán en su próxima negociación.":"As três mudanças que mais diferença vão fazer na sua próxima negociação."}</p></div><ol class="nextlist">${(r.recomendacoes||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>`:`<h2 class="sec">${t.rec1}</h2>
 <ol class="recs">${(r.recomendacoes||[]).slice(0,1).map(x=>`<li class="panel">${esc(x)}</li>`).join("")}</ol>`}
 <div class="panel" style="margin-top:28px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><strong>${LANG==="en"?"How was it?":LANG==="es"?"¿Qué le ha parecido?":"O que achou?"}</strong><p class="muted small">${LANG==="en"?"3 minutes to help us improve PARLEE.":LANG==="es"?"3 minutos para ayudarnos a mejorar PARLEE.":"3 minutos para nos ajudar a melhorar a PARLEE."}</p></div><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${QURL[LANG]}" target="_blank" rel="noopener">${GUEST_T[LANG][2]}</a></div>
 <div style="margin-top:28px"><button class="btn" id="tx" aria-expanded="false">${t.showTx}</button><div id="txbox"></div></div></div>`;
 const ag=document.getElementById("again"); if(ag) ag.onclick=()=>go("brief");
 ["again2","unlock"].forEach(id=>{const b=document.getElementById(id); if(b) b.onclick=()=>go("upgrade");});
 document.getElementById("other").onclick=()=>go("home");
 document.getElementById("tx").onclick=e=>{const b=document.getElementById("txbox"),open=!!b.innerHTML; b.innerHTML=open?"":`<div class="chat">${S.msgs.map(bubble).join("")}</div>`; e.currentTarget.setAttribute("aria-expanded",!open); e.currentTarget.textContent=open?t.showTx:t.hideTx;};
}
render();

</script>
</body>
</html>
